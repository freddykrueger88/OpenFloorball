name: openfloorball

services:
  # ────────────────────────────────────────
  # PostgreSQL 18
  # ────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: openfloorball_db
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-openfloorball}
      POSTGRES_USER: ${DB_USER:-openfloorball}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      # Neues Volume statt db_data (Issue Modernisierung Phase 5): das
      # Datenverzeichnis-Format ist zwischen Postgres-Majors inkompatibel,
      # ein Image-Tag-Wechsel allein würde den Container-Start verhindern.
      # Migration erfolgte per pg_dump/pg_restore, altes db_data-Volume
      # bleibt als Fallback erhalten (siehe CHANGELOG.md).
      # Ab Postgres 18 erwartet das offizielle Image den Mount-Punkt eine
      # Ebene höher (/var/lib/postgresql statt .../data, pg_ctlcluster-
      # kompatibles Layout) – ein Mount direkt auf .../data verweigert den
      # Start ("unused mount/volume").
      - db_data_pg18:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openfloorball} -d ${DB_NAME:-openfloorball}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────
  # Redis 8
  # ────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: openfloorball_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────
  # Backend (Node.js / Express)
  # ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-production}
    container_name: openfloorball_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-openfloorball}
      DB_USER: ${DB_USER:-openfloorball}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOARD_JSON_LIMIT: ${BOARD_JSON_LIMIT:-4mb}
      MAX_IMPORT_UNCOMPRESSED_MB: ${MAX_IMPORT_UNCOMPRESSED_MB:-25}
      SHARE_LINK_EXPIRES_HOURS: ${SHARE_LINK_EXPIRES_HOURS:-72}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-30000}
    volumes:
      - exports_data:/app/exports
      - backups_data:/app/backups
      - videos_data:/app/videos
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ────────────────────────────────────────
  # Frontend (React/Vite → Nginx)
  # ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: openfloorball_frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  # Altes Postgres-16-Volume bewusst NICHT entfernt (Fallback bis der
  # Umstieg auf Postgres 18 manuell bestätigt ist), wird aber von keinem
  # Service mehr referenziert.
  db_data:
    name: openfloorball_db_data
  db_data_pg18:
    name: openfloorball_db_data_pg18
  redis_data:
    name: openfloorball_redis_data
  exports_data:
    name: openfloorball_exports_data
  backups_data:
    name: openfloorball_backups_data
  videos_data:
    name: openfloorball_videos_data

networks:
  internal:
    name: openfloorball_internal
    driver: bridge
    internal: false  # Frontend braucht Port-Zugang von außen
