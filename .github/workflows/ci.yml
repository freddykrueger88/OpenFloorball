name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────
  backend:
    name: 📦 Backend (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openfloorball_test
          POSTGRES_USER: openfloorball
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openfloorball -d openfloorball_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: openfloorball_test
      DB_USER: openfloorball
      DB_PASSWORD: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      EXPORTS_DIR: /tmp/openfloorball-exports-ci
      VIDEOS_DIR: /tmp/openfloorball-videos-ci
      BACKUPS_DIR: /tmp/openfloorball-backups-ci
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate lockfile (if missing)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Lint
        run: npm run lint

      - name: Install FFmpeg (für GIF-/MP4-Export-Tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          # Produktions-Image (Alpine) legt die Schrift unter /usr/share/fonts/dejavu/ ab
          # (siehe backend/Dockerfile + WATERMARK_FONT in exportController.js) – Ubuntu
          # verwendet einen anderen Pfad, daher hier nachbilden statt Code für CI anzupassen.
          sudo mkdir -p /usr/share/fonts/dejavu
          sudo cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf

      - name: Test
        run: npm test

  # ─────────────────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend (Lint, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────
  docker:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: openfloorball-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: openfloorball-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
